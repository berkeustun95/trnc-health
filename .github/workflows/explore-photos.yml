# ─── Explore place photos: mirror + attribute (scripts/seed-explore-photos.mjs) ─
#
# The only runner of the photo backfill's --apply: it mirrors each manifest photo
# (scripts/data/explore-photo-manifest.json `places`, committed to main first) into the public
# `place-photos` bucket, resized only, never cropped, and UPDATEs that existing places row
# (photos, cover_image_url, photo_attribution, photo_credits). It adds no rows.
#
#   gh workflow run explore-photos                  # dry: validate the manifest, print the plan + rollback SQL
#   gh workflow run explore-photos -f apply=true    # dry, then apply once the dry passed
#
# No approval step: like an eatery-images upload, it only adds objects and sets photo columns
# on rows the manifest names, and the dry run prints the rollback SQL before anything is written.
# Berke 2026-11-08: the beach photos (pass 3) may go public at once.
# Secrets: the `production-storage` environment (main only): the service key + URL, nothing else.
# Public repo: the log carries place ids, names and photo URLs, all already public.

name: explore-photos

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write to production (otherwise a dry run)'
        type: boolean
        default: false

concurrency: { group: prod-explore-photos, cancel-in-progress: false }

jobs:
  dry:
    runs-on: ubuntu-24.04
    environment: production-storage
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Secrets
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
      - name: Explore photos (dry)
        run: node scripts/seed-explore-photos.mjs

  apply:
    if: ${{ inputs.apply }}
    needs: dry
    runs-on: ubuntu-24.04
    environment: production-storage
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - name: Main only
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::apply runs from main only"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Explore photos (apply)
        run: node scripts/seed-explore-photos.mjs --apply
