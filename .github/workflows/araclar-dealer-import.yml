# ─── Araçlar dealer import: a dealer's stock from data/dealers/<slug>/cars.csv + photos staged in dealer-intake ──
#
# Berke, 2026-11-10: real dealer cars come from a CSV he collects by hand (the owner consented), never from a website.
# scripts/import-dealer-cars.mjs adds new cars, updates changed ones, removes cars missing from the CSV (with a safety
# stop), and moves the photos staged in the private dealer-intake bucket (scripts/upload-dealer-photos.mjs, never git)
# into vehicle-images through the metadata stripper, emptying staging. The dealer row is created INACTIVE and never activated
# here, so production shows nothing; the run fails if anon can see a car of an inactive dealer. CI-only
# (scripts/lib/prod-write-guard.mjs). Dry by default. The log names cars by reference, make and model (stock data).
#
#   gh workflow run araclar-dealer-import -f dealer=mustafa-ustuner-otomotiv                  # dry: add / change / remove list
#   gh workflow run araclar-dealer-import -f dealer=mustafa-ustuner-otomotiv -f apply=true    # write
#   … -f apply=true -f confirm_remove=5                                                       # when more than a couple of cars go

name: araclar-dealer-import

on:
  workflow_dispatch:
    inputs:
      dealer:
        description: 'Dealer folder in data/dealers/'
        type: choice
        options: [mustafa-ustuner-otomotiv]
      apply:
        description: 'Write to production (otherwise dry run)'
        type: boolean
        default: false
      confirm_remove:
        description: 'Exact number of cars this run removes (only asked for when it is more than a couple)'
        type: string
        default: ''
      reactivate:
        description: 'References (comma-separated) of held cars to bring back: in the CSV but rejected / removed in ADA'
        type: string
        default: ''

concurrency: { group: prod-araclar-dealer-import, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      IN_DEALER: ${{ inputs.dealer }}
      IN_APPLY: ${{ inputs.apply }}
      IN_CONFIRM: ${{ inputs.confirm_remove }}
      IN_REACTIVATE: ${{ inputs.reactivate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Secrets
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
      - name: Mapping self-test
        run: node scripts/test-dealer-import.mjs
      - name: Import
        run: |
          [[ "$IN_CONFIRM" =~ ^[0-9]*$ ]] || { echo "::error::confirm_remove must be a number"; exit 1; }
          set -- --dealer "$IN_DEALER"
          [[ "$IN_REACTIVATE" =~ ^[A-Za-z0-9,\ -]*$ ]] || { echo "::error::reactivate must be a list of references"; exit 1; }
          if [ -n "$IN_CONFIRM" ]; then set -- "$@" --confirm-remove "$IN_CONFIRM"; fi
          if [ -n "$IN_REACTIVATE" ]; then set -- "$@" --reactivate "$IN_REACTIVATE"; fi
          if [ "$IN_APPLY" = "true" ]; then set -- "$@" --apply; fi
          node scripts/import-dealer-cars.mjs "$@"
