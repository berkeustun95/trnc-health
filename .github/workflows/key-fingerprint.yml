# ─── Which key is a repository secret? (fingerprint only) ─────────────────────
#
# GitHub never shows a secret's value. To tell whether two API keys are the same key — e.g. the CI
# Places key vs the Maps key shipped in the APK — compare fingerprints: this prints ONLY the first 16
# hex chars of sha256(secret) and its length. Locally: printf %s "$KEY" | shasum -a 256 | cut -c1-16
#
#   gh workflow run key-fingerprint -f secret=GOOGLE_PLACES_API_KEY
#
# Also the before/after check when a secret moves between repository and environment scope
# (2026-10-12: the five production secrets moved into the `production` environment).
# `-f environment=production-storage` (2026-10-31): EXPO_PUBLIC_SUPABASE_URL must match `production`'s;
# SUPABASE_SERVICE_ROLE_KEY is DELIBERATELY different (production-storage's own sb_secret_ key, revocable
# alone): prove it with a passing eatery-images dry run, never by copying production's key over it.
# A secret that environment lacks prints "is empty".

name: key-fingerprint

on:
  workflow_dispatch:
    inputs:
      secret:
        description: 'Secret to fingerprint'
        type: choice
        options: ['GOOGLE_PLACES_API_KEY', 'SUPABASE_SERVICE_ROLE_KEY', 'SUPABASE_ACCESS_TOKEN', 'ORS_API_KEY', 'GISEKIBRIS_FEED_URL', 'EXPO_PUBLIC_SUPABASE_URL']
      environment:
        description: 'Environment the secret is resolved through'
        type: choice
        default: production
        options: ['production', 'production-storage']

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 2
    permissions: {}
    env:
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
      GISEKIBRIS_FEED_URL: ${{ secrets.GISEKIBRIS_FEED_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      IN_NAME: ${{ inputs.secret }}
      IN_ENV: ${{ inputs.environment }}
    steps:
      - name: Fingerprint
        run: |
          # Allowlist BEFORE ${!IN_NAME}: indirect expansion evaluates an array subscript, so a name that ever
          # got past the server-side choice check could run code with every secret above in env.
          case "$IN_NAME" in GOOGLE_PLACES_API_KEY|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_ACCESS_TOKEN|ORS_API_KEY|GISEKIBRIS_FEED_URL|EXPO_PUBLIC_SUPABASE_URL) ;; *) echo "::error::not an allowed secret name"; exit 1 ;; esac
          case "$IN_ENV" in production|production-storage) ;; *) echo "::error::not an allowed environment"; exit 1 ;; esac
          v="${!IN_NAME}"
          [ -n "$v" ] || { echo "::error::$IN_NAME is empty"; exit 1; }
          echo "$IN_ENV/$IN_NAME: sha256[0:16]=$(printf %s "$v" | sha256sum | cut -c1-16) length=${#v}"
