# ─── Döveç: forget ONE enquiry by its reference (the privacy policy's early deletion on request) ────────────────────
#
# Wipes name, phone, e-mail, message and user id of a single enquiry (reference ADA-<number>), keeps the row, never touches status.
# The work is the database function public.dovec_lead_forget (migration 20261244), called with the service key over PostgREST RPC.
# Engine: scripts/dovec-lead-forget.mjs (pure parts and tests: scripts/lib/dovec-lead-forget.mjs, scripts/test-dovec-lead-forget.mjs).
# Dry and apply call the SAME function, so the dry run is a faithful preview.
#
#   gh workflow run dovec-lead-forget -f ref=ADA-123 -f email=<address the person wrote from>                 # DRY: prints true/false answers, writes nothing
#   gh workflow run dovec-lead-forget -f ref=ADA-123 -f email=<address> -f apply=true   # after a clean dry: waits for Berke in `production-db`, then wipes
#
# The tool takes the reference plus the e-mail address the person wrote from; the dry run answers yes/no "does that e-mail match the
# account that sent this enquiry" (no e-mail is ever printed). Apply refuses unless the answer is yes. BEFORE APPROVING: read the dry
# job's answer (email_matches_account must be true).
# Refused (nothing changes): a reference that is not exactly ADA-<number>, an unknown reference, the test enquiry, an enquiry still
# pending / retrying (wait until it is sent / rejected / failed, then run again), an enquiry with no linked account (already wiped or
# account deleted: a second apply on a wiped enquiry is refused), an account with no e-mail, and an e-mail that does not match.
# Runs from main only (the `production` environment is deployable from main only). Public log: ten booleans, nothing else; the reference and
# the e-mail are never printed: the FIRST step of the dry and apply jobs masks both (also the lower-cased / trimmed e-mail), read from the
# event payload, never from an env block or a command line, so the later `IN_REF` / `DOVEC_FORGET_EMAIL` env headers show ***. The e-mail
# reaches the engine only as that env variable (never argv). The approve job never sees either.
# Not scheduled, so no data_jobs heartbeat row. Needs migration 20261244 applied first (otherwise the call answers an HTTP error).

name: dovec-lead-forget

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Enquiry reference, exactly ADA-<number>'
        type: string
        required: true
      email:
        description: 'E-mail address the person wrote from (compared with the sending account; never printed)'
        type: string
        required: true
      apply:
        description: 'true = wipe the personal fields (needs approval); anything else = dry report'
        type: boolean
        required: false
        default: false

concurrency: { group: dovec-lead-forget, cancel-in-progress: false }

jobs:
  dry:
    if: ${{ !(github.actor == 'ada-dispatcher[bot]' || github.actor_id == '357529844' || github.triggering_actor == 'ada-dispatcher[bot]') }}
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      ok: ${{ steps.dry.outputs.ok }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mask the reference and the e-mail
        run: |
          ref=$(jq -r '.inputs.ref // empty' "$GITHUB_EVENT_PATH")
          email=$(jq -r '.inputs.email // empty' "$GITHUB_EVENT_PATH")
          trimmed=$(printf '%s' "$email" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          lowered=$(printf '%s' "$trimmed" | tr '[:upper:]' '[:lower:]')
          for x in "$ref" "$email" "$trimmed" "$lowered"; do
            printf '%s\n' "$x" | while IFS= read -r l; do [ -z "$l" ] || echo "::add-mask::$l"; done
          done
          case "$ref$email" in
            *$'\n'*|*$'\r'*) echo "::error::the reference and the e-mail must each be one line"; exit 1 ;;
          esac
      - name: Main only
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::runs from main only"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24' }
      - name: Dry run
        id: dry
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          IN_REF: ${{ inputs.ref }}
          DOVEC_FORGET_EMAIL: ${{ inputs.email }}
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
          node scripts/dovec-lead-forget.mjs --ref="$IN_REF"

  approve:
    if: ${{ !(github.actor == 'ada-dispatcher[bot]' || github.actor_id == '357529844' || github.triggering_actor == 'ada-dispatcher[bot]') && (inputs.apply && needs.dry.outputs.ok == 'true') }}
    needs: dry
    runs-on: ubuntu-24.04
    environment: production-db
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo "Forgetting one enquiry approved for production. Check the dry job's answer first; nothing else runs in this job."

  apply:
    if: ${{ !(github.actor == 'ada-dispatcher[bot]' || github.actor_id == '357529844' || github.triggering_actor == 'ada-dispatcher[bot]') && (inputs.apply && needs.dry.outputs.ok == 'true') }}
    needs: [dry, approve]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mask the reference and the e-mail
        run: |
          ref=$(jq -r '.inputs.ref // empty' "$GITHUB_EVENT_PATH")
          email=$(jq -r '.inputs.email // empty' "$GITHUB_EVENT_PATH")
          trimmed=$(printf '%s' "$email" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          lowered=$(printf '%s' "$trimmed" | tr '[:upper:]' '[:lower:]')
          for x in "$ref" "$email" "$trimmed" "$lowered"; do
            printf '%s\n' "$x" | while IFS= read -r l; do [ -z "$l" ] || echo "::add-mask::$l"; done
          done
          case "$ref$email" in
            *$'\n'*|*$'\r'*) echo "::error::the reference and the e-mail must each be one line"; exit 1 ;;
          esac
      - name: Main only
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::runs from main only"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24' }
      - name: Wipe
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          IN_REF: ${{ inputs.ref }}
          DOVEC_FORGET_EMAIL: ${{ inputs.email }}
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
          node scripts/dovec-lead-forget.mjs --ref="$IN_REF" --apply
