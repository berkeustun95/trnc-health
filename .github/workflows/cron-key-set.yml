# ─── Point the cron jobs at a secret key ─────────────────────────────────────
#
#   gh workflow run cron-key-set        then Berke approves production-db
#
# Writes one Vault secret. Deploy the functions first (verify_jwt = false + callerHoldsSecretKey), because until they
# are live the gateway refuses this key too. Engine: scripts/set-cron-key.mjs.

name: cron-key-set

on:
  workflow_dispatch: {}

concurrency: { group: supabase-migrate, cancel-in-progress: false }

jobs:
  approve:
    runs-on: ubuntu-24.04
    environment: production-db
    permissions: {}
    steps:
      - run: echo "Approved by Berke."
  apply:
    needs: approve
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      CRON_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24' }
      - name: Set the Vault secret
        run: node scripts/set-cron-key.mjs
