# ─── Hotels test window: activate / roll back the listed KITOB hotels ───────
#
# Production is written only from GitHub Actions (scripts/lib/prod-write-guard.mjs).
# Default is --dry: it reads, probes as anon, and writes nothing.
#
#   gh workflow run hotels-window                     # dry
#   gh workflow run hotels-window -f mode=--apply     # is_active = true on listed rows
#   gh workflow run hotels-window -f mode=--rollback  # is_active = false

name: hotels-window

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '--dry reads only; --apply / --rollback write'
        type: choice
        options: ['--dry', '--apply', '--rollback']
        default: '--dry'

concurrency: { group: prod-hotels, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Secrets present
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
      - name: hotels-window ${{ inputs.mode }}
        run: node scripts/hotels-window.mjs "$MODE"
