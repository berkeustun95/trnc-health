# ─── KITOB hotels: geocode unpinned hotels (OSM first, Google Places corroborated) ─
#
# CI-only (scripts/lib/prod-write-guard.mjs). Default is a dry run. Each Places call is
# billed: set `limit` for a look.
#
#   gh workflow run hotels-geocode -f limit=5        # dry, first 5 unpinned hotels
#   gh workflow run hotels-geocode -f apply=true     # write pins
#
# THE KNOWN-RISK LIST IS COMMITTED BACK. CLAUDE.md: every Google pin has a row in
# data/geocode-exceptions/google-pins.csv (no coordinates in it). On an apply that adds
# Google pins, this job commits that file to the branch it ran on — the only job here
# with contents: write. The geocode-google-*.csv outputs hold Places COORDINATES and
# are deliberately NOT uploaded: this repo and its artifacts are public.

name: hotels-geocode

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write pins to production (otherwise --dry-run)'
        type: boolean
        default: false
      limit:
        description: 'Optional: only the first N unpinned hotels (Places calls are billed)'
        type: string
        default: ''

concurrency: { group: prod-hotels, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      IN_APPLY: ${{ inputs.apply }}
      IN_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Secrets and inputs
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL GOOGLE_PLACES_API_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
          [ -z "$IN_LIMIT" ] || [[ "$IN_LIMIT" =~ ^[1-9][0-9]*$ ]] || { echo "::error::limit must be a positive integer"; exit 1; }
      - name: Self-test (offline)
        run: node scripts/geocode-kitob-hotels.mjs --self
      - name: Geocode
        run: |
          args=()
          if [ "$IN_APPLY" = "true" ]; then args+=(--apply); else args+=(--dry-run); fi
          [ -z "$IN_LIMIT" ] || args+=(--limit "$IN_LIMIT")
          node scripts/geocode-kitob-hotels.mjs "${args[@]}"
      - name: Commit the known-risk list
        if: inputs.apply
        run: |
          if git diff --quiet -- data/geocode-exceptions/google-pins.csv; then
            echo "google-pins.csv unchanged — no Google pins added."; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/geocode-exceptions/google-pins.csv
          git commit -m "google-pins.csv: rows for Google hotel pins from hotels-geocode run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
