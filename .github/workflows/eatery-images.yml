# ─── Eatery (Yeme-İçme) partner images: upload logo / gallery / menu photos ───
#
# The only writer of the public `eatery-images` bucket and of eatery_photos / eatery_partners.logo_path
# (service role only; production data is written from GitHub Actions only). Engine, file layout and every
# refusal rule: scripts/eatery-images.mjs. Files live in the repo at data/eatery/<slug>/ (manifest.json +
# images), committed to main BEFORE dispatching.
#
#   gh workflow run eatery-images -f slug=crunchy-express                      # dry: validate + print the plan
#   gh workflow run eatery-images -f slug=crunchy-express -f apply=true        # applies on its own once the dry is clean
#   ... -f replace=true   only to MOVE a row (logo_path / banner_path / photo row / dish photo_path) to a different
#                         path, e.g. a changed image or a legacy un-hashed name (default false). Nothing is
#                         overwritten: objects are named by the first 8 hex of their sha256 and uploaded with
#                         upsert:false, and a changed image gets a new name (new URL, so the app's disk cache
#                         cannot show the old picture). The old objects stay until a prune.
#   gh workflow run eatery-images -f slug=crunchy-express -f prune=true        # dry: lists unreferenced objects older than 7 days
#   ... -f prune=true -f apply=true   deletes them (own approval; never automatic; cannot be combined with replace)
#
# Three jobs. `dry` always runs (it needs the service key even to read inactive partner rows).
# UPLOAD (apply=true, no prune) — NO approval since 2026-10-31 (Berke): `apply` runs right after a CLEAN dry,
# i.e. the dry passed and its report has a plan, zero problems, no prune, and every object action is `upload`
# or `skip-identical`. Upload mode cannot delete or overwrite anything (content-addressed names, upsert:false);
# it adds objects and sets/repoints rows, and `apply` re-validates everything.
# PRUNE (prune=true + apply=true) deletes, so it keeps the approval: `approve` waits in `production-db` until
# Berke approves it (Actions → the run → Review deployments); only then does `apply` run. The approve job
# holds no secret. `apply` runs from main only.
# Secrets come from the `production-storage` environment (main only, no reviewers): the service key + URL
# and nothing else, so this workflow never sees the Management API token (schema) or the Places/ORS keys.
# The service key itself is not storage-scoped: the scope is this script (bucket eatery-images + the
# eatery photo/logo/banner/dish path columns). Public repo: stdout carries counts and keys
# only. The eatery-images-report artifact is NOT private: anyone signed in to GitHub can download it and
# secret masking does not apply to artifacts, so it holds the plan (object paths), problems and short
# sanitised error codes only, never raw error text.

name: eatery-images

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Partner slug (folder data/eatery/<slug>/ on main)'
        type: string
        required: true
      apply:
        description: 'Write to production (otherwise a dry run)'
        type: boolean
        default: false
      replace:
        description: 'Allow MOVING a row to a different object (logo_path / banner_path / photo row / dish photo_path); no object is ever overwritten'
        type: boolean
        default: false
      prune:
        description: 'Prune mode instead of an upload: list (dry) / delete (apply) old objects no row references, older than 7 days. Not with replace'
        type: boolean
        default: false

concurrency: { group: prod-eatery-images, cancel-in-progress: false }

jobs:
  dry:
    runs-on: ubuntu-24.04
    outputs:
      clean: ${{ steps.clean.outputs.clean }}
    environment: production-storage
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      IN_SLUG: ${{ inputs.slug }}
      IN_REPLACE: ${{ inputs.replace }}
      IN_PRUNE: ${{ inputs.prune }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Secrets and inputs
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
          [[ "$IN_SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "::error::slug must match ^[a-z0-9-]+$"; exit 1; }
      - name: Offline proofs
        run: node scripts/test-eatery-images.mjs
      - name: Eatery images (dry)
        run: |
          args=(--slug="$IN_SLUG" --report=eatery-images-report.json)
          [ "$IN_REPLACE" != "true" ] || args+=(--replace)
          [ "$IN_PRUNE" != "true" ] || args+=(--prune)
          node scripts/eatery-images.mjs "${args[@]}"
      - name: Clean for an unapproved apply
        id: clean
        run: |
          clean=$(node -e "
            const r = JSON.parse(require('fs').readFileSync('eatery-images-report.json', 'utf8'))
            const ok = !!r.plan && !r.prune_plan && !r.prune && r.problems.length === 0 && (r.errors || []).length === 0
              && r.plan.uploads.every(u => u.action === 'upload' || u.action === 'skip-identical')
            console.log(ok ? 'true' : 'false')
          ")
          echo "clean=$clean" >> "$GITHUB_OUTPUT"
          echo "clean for an unapproved upload apply: $clean"
      - name: Counts summary
        if: always()
        run: |
          [ -f eatery-images-report.json ] || { echo "eatery-images dry: no report (refused before planning)" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node -e "
            const r = JSON.parse(require('fs').readFileSync('eatery-images-report.json', 'utf8'))
            const p = r.plan, c = a => p ? p.uploads.filter(u => u.action === a).length : 0
            const q = r.prune_plan
            console.log(q
              ? 'eatery-images prune dry ' + r.slug + ': objects ' + q.objects + ' / referenced ' + q.referenced + ' / would delete ' + q.delete.length + ' / kept ' + q.keep.length + ' / problems ' + r.problems.length
              : p
              ? 'eatery-images dry ' + r.slug + ': uploads ' + c('upload') + ' / skips ' + c('skip-identical') + ' / replaces ' + c('replace') + ' / rows ' + p.inserts.length + ' insert + ' + p.updates.length + ' update / logo ' + p.logo.action + ' / banner ' + (p.banner ? p.banner.action : 'none') + ' / dish rows set ' + (p.dishes || []).filter(d => d.row === 'set').length + ' keep ' + (p.dishes || []).filter(d => d.row === 'keep').length + ' / problems ' + r.problems.length
              : 'eatery-images dry ' + r.slug + ': refused, problems ' + r.problems.length)
          " >> "$GITHUB_STEP_SUMMARY"
      - name: Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: eatery-images-report-dry
          path: eatery-images-report.json
          if-no-files-found: ignore
          retention-days: 7

  approve:
    if: ${{ inputs.apply && inputs.prune }}
    needs: dry
    runs-on: ubuntu-24.04
    environment: production-db
    timeout-minutes: 5
    permissions: {}
    env:
      IN_SLUG: ${{ inputs.slug }}
      IN_APPLY: ${{ inputs.apply }}
      IN_REPLACE: ${{ inputs.replace }}
      IN_PRUNE: ${{ inputs.prune }}
    steps:
      - name: What is being approved
        run: |
          echo "slug=$IN_SLUG apply=$IN_APPLY replace=$IN_REPLACE prune=$IN_PRUNE"
          if [ "$IN_PRUNE" = "true" ]; then echo "::warning::PRUNE: permanently DELETES public objects no row references (older than 7 days)"; echo "PRUNE: deletes unreferenced objects older than 7 days"; fi
          if [ "$IN_REPLACE" = "true" ]; then echo "::warning::REPLACE: moves logo_path / banner_path / photo rows / dish photo_path to new object names (no object is overwritten)"; echo "REPLACE: repoints rows to new object names; nothing is overwritten"; fi
          echo "Prune for $IN_SLUG approved for production."

  apply:
    # !cancelled(): approve is SKIPPED on the upload lane, which would otherwise skip apply too.
    if: ${{ !cancelled() && inputs.apply && needs.dry.result == 'success' && ((inputs.prune && needs.approve.result == 'success') || (!inputs.prune && needs.dry.outputs.clean == 'true')) }}
    needs: [dry, approve]
    runs-on: ubuntu-24.04
    environment: production-storage
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      IN_SLUG: ${{ inputs.slug }}
      IN_REPLACE: ${{ inputs.replace }}
      IN_PRUNE: ${{ inputs.prune }}
      APPROVED: ${{ needs.approve.result }}
    steps:
      - name: Main only, and a prune only when approved
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::apply runs from main only"; exit 1; }
          [ "$IN_PRUNE" != "true" ] || [ "$APPROVED" = "success" ] || { echo "::error::prune deletes and needs the production-db approval"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Secrets and inputs
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
          [[ "$IN_SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "::error::slug must match ^[a-z0-9-]+$"; exit 1; }
      - name: Eatery images (apply)
        run: |
          args=(--slug="$IN_SLUG" --apply --report=eatery-images-report.json)
          [ "$IN_REPLACE" != "true" ] || args+=(--replace)
          [ "$IN_PRUNE" != "true" ] || args+=(--prune)
          node scripts/eatery-images.mjs "${args[@]}"
      - name: Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: eatery-images-report-apply
          path: eatery-images-report.json
          if-no-files-found: ignore
          retention-days: 7
