# ─── Set an Edge Function secret from a repo secret ──────────────────────────
#
# The only path for function secrets: no Mac holds a Supabase access token (removed
# 2026-10-01). Manual only, DRY unless apply=true. The value never appears in a command line,
# a log or an input: it is read from the repo secret of the SAME NAME and written to a 600
# env file on the runner.
#
#   gh secret set GOOGLE_PLACES_SERVER_KEY            # Berke, once (prompted, not echoed)
#   gh workflow run supabase-function-secrets -f name=GOOGLE_PLACES_SERVER_KEY            # dry
#   gh workflow run supabase-function-secrets -f name=GOOGLE_PLACES_SERVER_KEY -f apply=true
#
# Dry: proves the repo secret is present and shaped like a Google API key, and says whether
# the function secret already exists (name + digest only). Apply: sets it, then asserts the
# name is listed with a digest that matches the value's sha256 (supabase secrets list shows
# a SHA-256 digest, never the value). A new secret name is added to `options` below first.

name: supabase-function-secrets

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Function secret to set (from the repo secret of the same name)'
        type: choice
        options: ['GOOGLE_PLACES_SERVER_KEY']
      apply:
        description: 'Set it (false = dry run)'
        type: boolean
        default: false

concurrency: { group: supabase-functions, cancel-in-progress: false }

jobs:
  secret:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      NAME: ${{ inputs.name }}
      APPLY: ${{ inputs.apply }}
      VALUE: ${{ secrets[inputs.name] }}
      SB: npx --yes supabase@2.104.0
    steps:
      - name: Inputs, project ref, value shape (never printed)
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_URL; do [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }; done
          [ -n "$VALUE" ] || { echo "::error::repo secret $NAME is not set — gh secret set $NAME first"; exit 1; }
          case "$NAME" in
            GOOGLE_PLACES_SERVER_KEY) [[ "$VALUE" =~ ^AIza[0-9A-Za-z_-]{35}$ ]] || { echo "::error::$NAME is not shaped like a Google API key (AIza + 35)"; exit 1; } ;;
          esac
          REF=$(sed -E 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#' <<<"$SUPABASE_URL")
          [[ "$REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::could not derive the project ref"; exit 1; }
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "WANT=$(printf '%s' "$VALUE" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "  ✓ repo secret $NAME present and well-formed (value not shown)"
      - name: Before — is it set live? (name + digest only)
        run: |
          $SB secrets list --project-ref "$REF" -o json > before.json
          node -e '
            // The digest field name is not pinned by the CLI docs: accept value or digest, and fail
            // loudly if neither is there (a check comparing undefined would pass nothing).
            const s = require("./before.json").find(x => x.name === process.env.NAME)
            const d = s && (s.value ?? s.digest)
            if (s && typeof d !== "string") { console.error("::error::secrets list has no digest field: " + Object.keys(s).join(",")); process.exit(1) }
            console.log(s ? `  ${process.env.NAME}: SET live, digest ${d.slice(0, 12)}… (${d === process.env.WANT ? "same value as the repo secret" : "DIFFERENT from the repo secret"})`
                          : `  ${process.env.NAME}: not set live`)'
      - name: Apply
        if: ${{ inputs.apply }}
        run: |
          umask 077
          printf '%s=%s\n' "$NAME" "$VALUE" > "$RUNNER_TEMP/fn.env"
          $SB secrets set --project-ref "$REF" --env-file "$RUNNER_TEMP/fn.env"
          rm -f "$RUNNER_TEMP/fn.env"
      - name: After — listed, digest matches
        if: ${{ inputs.apply }}
        run: |
          $SB secrets list --project-ref "$REF" -o json > after.json
          node -e '
            const s = require("./after.json").find(x => x.name === process.env.NAME)
            const d = s && (s.value ?? s.digest)
            const ok = typeof d === "string" && d === process.env.WANT
            console.log(`  ${ok ? "✓" : "✗"} ${process.env.NAME}: ${s ? `digest ${String(d).slice(0, 12)}…` : "NOT LISTED"}${ok ? " = sha256 of the repo secret" : ""}`)
            if (!ok) process.exit(1)'
      - name: Dry run note
        if: ${{ !inputs.apply }}
        run: echo "DRY RUN — nothing was set. Re-run with -f apply=true."
