# ─── Duyurular: weekly recheck of paused sources (read-only) ─────────────────
#
# A source set active:false in scripts/duyurular/sources.mjs because its site is down on their
# side (gau-duyurular, genclik: 2026-10-26) is fetched once a week with its own parser. If one
# answers 200 WITH items, this opens an issue "Source back up: <name>" (GitHub emails it).
# It never reactivates anything: that stays a reviewed edit of sources.mjs.
# The `recheck` job has no secrets, no environment and never touches the database. The separate `record` job
# (scheduled runs only) holds the production environment and the service key for ONE write: this run's heartbeat
# row (job key, ok/failed, error class, run id) in data_job_runs (data jobs, slice 2). It checks out the repo,
# installs Node, runs one script, and creates a `production` deployment record each Monday; it takes nothing
# from `recheck` but its result. A failed `record` turns the run red (no job-level continue-on-error: the actor
# rule, scripts/check-dispatcher-actor.mjs, forbids it on a guarded job).
#
#   gh workflow run duyurular-paused-recheck

name: duyurular-paused-recheck

on:
  schedule:
    # Mondays 06:00 UTC = 09:00 TRNC.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  recheck:
    if: ${{ !(github.actor == 'ada-dispatcher[bot]' || github.actor_id == '357529844' || github.triggering_actor == 'ada-dispatcher[bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Check paused sources
        run: node scripts/check-duyurular-paused.mjs --out=back.txt
      - name: Open an issue per source that is back (once; an open issue is not duplicated)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS=$'\t' read -r key name; do
            [ -n "$key" ] || continue
            title="Source back up: $name"
            if gh issue list --state open --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
              echo "already open: $title"; continue
            fi
            gh issue create --title "$title" --body "\`$key\` answered HTTP 200 with announcements in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.

          It is still paused (\`active: false\` in \`scripts/duyurular/sources.mjs\`). To resume fetching, remove that line by PR."
          done < back.txt
      - name: Alert on a red run (issue mentions Berke; the next green run closes it)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Scheduled runs are attributed to ada-claude-code[bot], so GitHub's own failure email reaches nobody.
          title='Duyurular paused-recheck is red'
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          num=$(gh issue list --state open --limit 200 --json number,title,author \
            | jq -r --arg t "$title" '[.[] | select(.title == $t and .author.login == "app/github-actions")][0].number // empty')
          if [ "$JOB_STATUS" = "success" ]; then
            [ -z "$num" ] || gh issue close "$num" --comment "Green again: $run"
            exit 0
          fi
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body "Run $JOB_STATUS ($GITHUB_EVENT_NAME): $run"$'\n\n@berkeustun95'
          else
            gh issue comment "$num" --body "Still red ($GITHUB_EVENT_NAME): $run"
          fi

  # One heartbeat row per scheduled run, from its own job so `recheck` keeps no environment and no key.
  record:
    needs: [recheck]
    if: ${{ !(github.actor == 'ada-dispatcher[bot]' || github.actor_id == '357529844' || github.triggering_actor == 'ada-dispatcher[bot]') && (always() && github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24' }
      - name: Record the run (data_job_runs)
        timeout-minutes: 2
        env:
          RECHECK_RESULT: ${{ needs.recheck.result }}
          REAL_RUN: ${{ github.event_name == 'schedule' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: node scripts/record-data-job-run.mjs --status="$RECHECK_RESULT" --real-run="$REAL_RUN"
