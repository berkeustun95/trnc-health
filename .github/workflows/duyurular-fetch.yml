# ─── Duyurular: official TRNC announcements → public.announcements ──────────
#
# Plan: vault 10-ada/2026-10-10_duyurular-plan.md. Script: scripts/fetch-duyurular.mjs.
# Dry unless `-f apply=true`:  gh workflow run duyurular-fetch [-f apply=true] [-f only=khk-disa-acik-munhal]
#
# ─── EVERY ~30 MIN: A SELF-CHAINING RUN, WITH CRON AS THE FALLBACK (2026-10-11) ──
# GitHub's cron fired 09:14, 02:07, 23:26 UTC on 2026-10-10/11 — hours apart, not every 30 min.
# So each run that is part of the chain (scheduled, or dispatched with chain=true) ends by
# waiting until ~30 min after it started and dispatching the next run with its own
# GITHUB_TOKEN (workflow_dispatch is the one event a GITHUB_TOKEN may trigger). No new secret,
# no database change, and production is still written only from Actions.
#   • ONE chain: the dispatch step skips when any other run of this workflow is queued or in
#     progress, so a cron run arriving mid-chain cannot start a second one.
#   • ONE writer at a time: the concurrency group below (a run waits, it never overlaps), and
#     official_url UNIQUE + upsert ignoreDuplicates in the database.
#   • A broken chain (cancelled run, GitHub outage) restarts on the next cron run; daily-health
#     flags no successful fetch in 2+ hours (scripts/check-duyurular-health.mjs).
#   • A manual dispatch without chain=true never extends the chain.
#
# ─── SCHEDULE ───────────────────────────────────────────────────────────────
# Added 2026-10-10 after 20261102 was applied (15:32 UTC) and the first apply dispatch was green
# (run 38064201761: 227 rows, 0 published, 0 failed sources). A scheduled run always writes;
# rows land with is_published = false until announcement_sources.publish is flipped (go-live).
#
# ─── THIS REPO IS PUBLIC, SO THESE LOGS ARE PUBLIC ──────────────────────────
# The script prints counts and source keys only. Titles, URLs and per-item deadline outcomes go
# to the report artifact (7-day retention). Page and PDF text is never printed or stored: only
# a parsed date leaves the process.
#
# ─── SECRETS ────────────────────────────────────────────────────────────────
#   SUPABASE_SERVICE_ROLE_KEY   apply only; writes announcements + announcement_sources health
#   EXPO_PUBLIC_SUPABASE_URL    project url

name: duyurular-fetch

on:
  schedule:
    # Every 30 min; each source keeps its own fetch_interval_min (30 min to a day), so most
    # runs fetch a handful of listings. GitHub may start a scheduled run late or skip one.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write to the database (false = dry run: fetch, parse, report)'
        type: boolean
        default: false
      only:
        description: 'Comma-separated source keys (empty = all)'
        type: string
        default: ''
      force:
        description: 'Ignore each source fetch_interval_min'
        type: boolean
        default: false
      chain:
        description: 'Part of the 30-min chain: dispatch the next run when done (implies a write)'
        type: boolean
        default: false

concurrency:
  group: duyurular-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write      # the chain step lists and dispatches runs of THIS workflow
    timeout-minutes: 60
    env:
      # A scheduled run has no inputs (inputs.apply is null), so writing is decided here, once:
      # schedule = write, chain = write, dispatch = write only with -f apply=true.
      WRITE: ${{ github.event_name == 'schedule' || inputs.apply == true || inputs.chain == true }}
      CHAIN: ${{ github.event_name == 'schedule' || inputs.chain == true }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ (github.event_name == 'schedule' || inputs.apply == true || inputs.chain == true) && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - name: Start time (the chain measures 30 min from here)
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: npm

      # Root tree for @supabase/supabase-js; the fetcher's own tree (unpdf, pinned) for PDFs.
      # Both lockfile-driven.
      - name: Install
        run: |
          npm ci
          npm ci --prefix scripts/duyurular

      - name: Self-test (offline; asserts the runner ICU lowercases Turkish)
        run: |
          node scripts/fetch-duyurular.mjs --selftest
          node scripts/check-prod-write-guard.mjs

      - name: Fetch
        env:
          FORCE: ${{ inputs.force == true && '--force' || '' }}
          ONLY: ${{ inputs.only || '' }}
        run: |
          echo "event=$GITHUB_EVENT_NAME write=$WRITE"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$WRITE" != "true" ]; then
            echo "::error::a scheduled run resolved to a dry run; the WRITE gate is broken"; exit 1
          fi
          set -- --report=duyurular-report.json
          [ "$WRITE" = "true" ] && set -- "$@" --apply
          [ -n "$FORCE" ] && set -- "$@" "$FORCE"
          [ -n "$ONLY" ] && set -- "$@" "--only=$ONLY"
          node scripts/fetch-duyurular.mjs "$@"

      - name: Database counts (service role read; counts only)
        if: env.WRITE == 'true'
        run: node scripts/fetch-duyurular.mjs --counts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: duyurular-report
          path: duyurular-report.json
          retention-days: 7
          if-no-files-found: ignore

      # Last step, and it runs after a failed fetch too: one broken site must not stop the chain.
      # A cancelled run does stop it (that is how a human halts it); cron restarts it.
      - name: Chain the next run (~30 min after this one started)
        if: ${{ !cancelled() && env.CHAIN == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - RUN_START ))
          wait=$(( 1800 - 90 - elapsed ))       # ~90 s is the next run's queue + checkout + npm ci
          if [ "$wait" -gt 0 ]; then echo "waiting ${wait}s"; sleep "$wait"; fi
          others=$(gh run list --workflow duyurular-fetch.yml --limit 20 --json databaseId,status \
            -q "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\" or .status == \"requested\"))] | length")
          if [ "${others:-1}" != "0" ]; then
            echo "another run is queued or running (${others}); it carries the chain — not dispatching"
            exit 0
          fi
          gh workflow run duyurular-fetch.yml --ref "$GITHUB_REF_NAME" -f chain=true
          echo "dispatched the next run on $GITHUB_REF_NAME"
