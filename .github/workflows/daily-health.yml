# ─── Daily content health (read-only) ────────────────────────────────────────
#
# The checks that used to be run by hand from a Mac holding the service key. No Mac
# holds one now, so this is where they run. Read-only: every script here only SELECTs.
# Each step runs even if an earlier one failed, so one email carries every red; the
# job fails if any did — that failure IS the alert (GitHub emails on failure).
#
# Gişe Kıbrıs health is not here: gisekibris-feed runs it daily as its last step.
#
#   gh workflow run daily-health

name: daily-health

on:
  schedule:
    # 05:00 UTC = 08:00 TRNC, after the 04:15 Gişe Kıbrıs sync.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read       # duyurular:health reads duyurular-fetch's own runs (question 5)
      issues: write       # the alert step below
      checks: read        # …and the latest run's annotations: "chain completed via AIA" notices (info only)
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Secrets present
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
          [ -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ] || { echo "::error::EXPO_PUBLIC_SUPABASE_ANON_KEY is empty"; exit 1; }
      - name: hotels:health
        if: success() || failure()
        run: npm run -s hotels:health
      - name: novest:health
        if: success() || failure()
        run: npm run -s novest:health
      # novest:verify is NOT here on purpose: it is the post-import check (a fixed expected
      # row set, all active, a fixed image-less set) and reads red on a healthy, grown
      # catalogue. Run it by hand after an import. This is the standing question it was answering daily:
      - name: novest:photos (live listings with no photo; fails above 10%)
        if: success() || failure()
        run: |
          node scripts/check-novest-photos.mjs --self
          npm run -s novest:photos
      - name: novest:text (no phone / e-mail / WhatsApp in stored listing text; any status)
        if: success() || failure()
        run: |
          node scripts/check-novest-descriptions.mjs --self
          npm run -s novest:text
      - name: duty push sent recently
        if: success() || failure()
        run: node scripts/check-duty-push-staleness.mjs
      - name: notify:health
        if: success() || failure()
        run: npm run -s notify:health
      # Araçlar (2026-11-08): approval queue < 48 h, the expire-vehicles cron ran, the nightly photo cleanup ran.
      - name: cars:health
        if: success() || failure()
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-cars-staleness.mjs
      # Duyurular (2026-10-11): pipeline alive (fetch < 2 h, no source failing 3+ runs, a new
      # item < 3 days, banner count readable as anon, no red duyurular-fetch run in 24 h) and
      # content not stale (≥ 50 visible, newest < 7 days, anon count = service count). Offline
      # self-tests first.
      - name: duyurular:health
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-duyurular-health.mjs --self
          npm run -s duyurular:health
      - name: duyurular:staleness
        if: success() || failure()
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-duyurular-staleness.mjs --self
          npm run -s duyurular:staleness
      # Eatery (Yeme-İçme) menu freshness (2026-10-18): every ACTIVE partner must have menu_verified_on
      # within 30 days. Anon key only, so RLS shows exactly the active rows; zero active partners = OK.
      # Fails closed on any HTTP/network error. The ota chain only warns (a hotfix OTA is never blocked).
      - name: eatery:menu-staleness
        if: success() || failure()
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/test-eatery-daily.mjs
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-eatery-partners.mjs --daily
      # Website partners (2026-11-02): every stored partner_item_id (the ?cart= ids) still exists on the partner's own site.
      # Service key, GET only: inactive partners included. Red on a missing id, an item without one, or any failed read.
      - name: eatery:partner-ids
        if: success() || failure()
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-eatery-partner-ids.mjs

      # GitHub emails a scheduled job's failure to whoever last edited the schedule, which is a bot, so a red run told
      # nobody: Novest and the duty push were down for days. One issue stays open while anything is red, and Berke is
      # mentioned only when the set of failing checks changes. Step names only: this repo and its issues are public.
      - name: Alert Berke
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failing=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure") | "- " + .name] | sort | join("\n")')
          title='Daily health is red'
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,body \
            --jq '.[0] // empty')
          num=$(jq -r '.number // empty' <<<"$issue")
          if [ -z "$failing" ]; then
            [ -z "$num" ] || gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment 'All checks are green again.'
            exit 0
          fi
          body=$(printf 'Failing checks:\n\n%s\n\nLatest run: %s/%s/actions/runs/%s' "$failing" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if [ -z "$num" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"$'\n\n@berkeustun95'
          elif [ "$(jq -r '.body' <<<"$issue" | sed -n '/^- /p')" != "$failing" ]; then
            gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "@berkeustun95 the failing checks changed:"$'\n\n'"$failing"
          fi
