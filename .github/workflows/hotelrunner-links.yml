# ─── HotelRunner booking links → hotels.hotelrunner_url (data/kitob/hotelrunner-links.json) ───────
#
# Production is written only from GitHub Actions (scripts/lib/prod-write-guard.mjs).
# Default is --dry: it reads, probes as anon, and writes nothing.
#
#   gh workflow run hotelrunner-links                     # dry: prints set / clear / unchanged
#   gh workflow run hotelrunner-links -f mode=--apply     # writes the file to the database

name: hotelrunner-links

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '--dry reads only; --apply writes'
        type: choice
        options: ['--dry', '--apply']
        default: '--dry'

concurrency: { group: prod-hotels, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Secrets present
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
      - name: hotelrunner-links ${{ inputs.mode }}
        run: node scripts/apply-hotelrunner-links.mjs "$MODE"
