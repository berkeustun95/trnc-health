# ─── Run a Live Scores sync function by hand ─────────────────────────────────
#
#   gh workflow run live-scores-run -f sport=football -f mode=daily
#   gh workflow run live-scores-run -f sport=football -f mode=leagues   # list current World competitions
#
# The functions accept only service_role (see callerIsServiceRole in
# supabase/functions/_shared/live-scores.mjs). Every API call still goes through
# claim_api_request, so a hand run spends the same 90/day/sport budget as the cron.
# The key is never printed; the function's JSON log is.

name: live-scores-run

on:
  workflow_dispatch:
    inputs:
      sport:
        type: choice
        options: ['football', 'basketball', 'f1']
      mode:
        type: choice
        options: ['daily', 'poll', 'leagues']

concurrency: { group: live-scores-run, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      IN_SPORT: ${{ inputs.sport }}
      IN_MODE: ${{ inputs.mode }}
    steps:
      - name: Call the function
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
          if [ "$IN_MODE" = "leagues" ] && [ "$IN_SPORT" != "football" ]; then
            echo "::error::leagues mode exists for football only"; exit 1
          fi
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' \
            -d "{\"mode\":\"$IN_MODE\"}" "$SUPABASE_URL/functions/v1/live-scores-$IN_SPORT")
          echo "HTTP $code"
          node -e 'const j=JSON.parse(require("fs").readFileSync("out.json","utf8")); console.log(JSON.stringify(j,null,1))' || cat out.json
          [ "$code" = "200" ]
