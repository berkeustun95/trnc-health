# ─── Migration status report — READ ONLY ─────────────────────────────────────
#
# Which files in supabase/migrations/ are applied to production, and which are not.
# Reads as `supabase_read_only_user` through the Management API's read-only endpoint
# (proved each run: no INSERT/UPDATE/DELETE). No DDL, no DML, no ledger writes.
# Engine: scripts/supabase-migration-status.mjs.
#
#   gh workflow run supabase-migration-status
#
# Output: the job summary (file | status | evidence) and the `migration-status` artifact.

name: supabase-migration-status

on:
  workflow_dispatch:

concurrency: { group: supabase-migration-status, cancel-in-progress: true }

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24' }
      # The checksum algorithm lives only in migration-ledger.mjs, so the check is
      # regenerated from disk here rather than trusted as committed.
      - name: Regenerate the ledger check from disk
        run: |
          node scripts/migration-ledger.mjs
          if git diff --quiet -- supabase/migration_ledger_check.sql; then
            echo "LEDGER_CHECK_FRESH=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::the committed supabase/migration_ledger_check.sql is stale; the report uses the regenerated one"
            echo "LEDGER_CHECK_FRESH=no" >> "$GITHUB_ENV"
          fi
      - name: Status report (supabase_read_only_user)
        run: node scripts/supabase-migration-status.mjs migration-status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: migration-status
          path: migration-status/
          if-no-files-found: warn
