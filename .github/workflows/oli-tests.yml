# Ask Oli render test + routing audit, then the offline data-job heartbeat guards, on every PR and push to main. The same `npm run test:oli` also runs first in
# `npm run ota` and `npm run ota:preview`, so nothing ships without it. No secrets: the test mocks Supabase.
name: oli-tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:oli
      - name: Data-job heartbeat guards (offline, no secrets)
        run: |
          node scripts/record-data-job-run.mjs --selftest
          node scripts/check-data-job-heartbeats.mjs --selftest
          node scripts/check-data-job-heartbeats.mjs
      - name: sync-novest caller gate (offline guard)
        run: node scripts/check-sync-novest-auth.mjs
