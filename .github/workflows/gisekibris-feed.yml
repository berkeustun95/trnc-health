# ─── Gişe Kıbrıs daily feed sync ─────────────────────────────────────────────
#
# Replaces the manual weekly run of the same four scripts, plus the cancellation
# sweep. The partner shipped their automation on 2026-09-23; this consumes it.
#
# ─── WHY ACTIONS AND NOT pg_cron ────────────────────────────────────────────
# The repo's existing crons (duty notifications, featured-expiry, job auto-expire)
# are SQL doing SQL. This pipeline needs Node, `sharp` for image re-encoding, and
# outbound HTTPS to two different hosts. None of that lives in Postgres.
#
# ─── SECRETS (repository settings → Secrets and variables → Actions) ────────
#   GISEKIBRIS_FEED_URL          the partner feed. THE PATH TOKEN IS OUR KEY.
#   SUPABASE_SERVICE_ROLE_KEY    bypasses RLS; required to write status='approved'
#                                and to upload mirrored images
#   EXPO_PUBLIC_SUPABASE_URL     project url
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  for the guest-session health check
#
# The feed url is a secret because its path token is the partner key. It is NOT
# named EXPO_PUBLIC_* anywhere — that prefix is inlined into the client bundle by
# Expo, which would publish the key to every user. fetch-gisekibris-feed.mjs masks
# it in every line it prints, errors included.
#
# ─── WHY A BAD FEED CANNOT WIPE THE CATALOGUE ───────────────────────────────
# Three independent reasons, none of which relies on this file being careful:
#   1. fetch- refuses a non-200, non-JSON, non-array, EMPTY array, or a row missing
#      a required field, and writes nothing. prepare never sees a bad file.
#   2. The importer NEVER DELETES. A row absent from the feed is reported, not
#      removed, so the worst case of a partial feed is a stale catalogue.
#   3. The sweep is capped (5 rows absolute, 25% of eligible) and stops rather than
#      applying a large batch — a truncated feed that passes (1) would otherwise
#      arrive here as dozens of silent cancellations.
#
# ─── THIS WORKFLOW DOES NOT COMMIT ANYTHING ─────────────────────────────────
# prepare rewrites supabase/seed/gisekibris-events-clean.json and check-urls may
# null a dead ticket_url in it. Both are ephemeral here: the checkout is thrown
# away. The database is the live record; the committed seed is a snapshot a human
# refreshes. Nothing bot-commits, so nothing can churn the repo or race a push.
#
# ─── ONE BAD ROW SKIPS ONE ROW (Berke, 2026-11-14) ──────────────────────────
# A row prepare cannot use, or one IN the feed that reads isCancelled=TRUE, is left
# out of the import and listed in the "rows need a decision" issue; the rest of the
# feed still syncs (8 such rows had stopped every sync 11-08 → 11-14). Nothing is
# cancelled automatically for those rows. A feed with no usable row, and the
# sweep's cap, still fail the job, which opens the "sync is red" issue.

name: gisekibris-feed

on:
  schedule:
    # 04:15 UTC = 06:15 in TRNC in winter (EET, UTC+2), 07:15 in summer. After the
    # partner's overnight edits and before anyone is using the app. Cron here is always UTC.
    - cron: '15 4 * * *'
  workflow_dispatch:         # manual trigger, so a human can force a sync
    inputs:
      dry:
        description: 'Dry run: fetch, prepare, probe links, import --dry, sweep --dry (reads the DB, writes nothing, opens no issue)'
        type: boolean
        default: false
      null_dead_links:
        description: 'Also hide Buy Ticket (ticket_url = null, max 5) on rows outside the feed whose page is dead. With dry: show what it would null.'
        type: boolean
        default: false

concurrency:
  # Two overlapping runs would both upsert and both mirror images. Harmless but
  # wasteful, and it makes the logs ambiguous about which run wrote what.
  group: gisekibris-feed
  cancel-in-progress: false

jobs:
  # ─── The pause switch (data jobs, slice 3) ─────────────────────────────────
  # Asks public.data_job_gate whether gisekibris-feed is paused (admin screen "Data jobs"). A paused answer skips
  # the working job below: nothing writes, no heartbeat row (the gate records one skipped_paused row), no alert step runs.
  # FAIL-OPEN: any error here (key, network, RPC not applied yet, even a failing step) lets the working job run: every step here has
  # continue-on-error: true and the job has none (a job-level one is forbidden by scripts/check-dispatcher-actor.mjs);
  # only the exact output `false` stops it. See scripts/data-job-gate.mjs.
  gate:
    if: ${{ (!(github.actor == 'ada-dispatcher[bot]' || github.actor_id == '357529844' || github.triggering_actor == 'ada-dispatcher[bot]') || (github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && github.ref == 'refs/heads/main' && inputs.dry == false && inputs.null_dead_links == false)) }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
        continue-on-error: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
        continue-on-error: true
      - name: Pause switch (data_job_gate)
        id: gate
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.event_name == 'schedule' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: node scripts/data-job-gate.mjs
        continue-on-error: true

  sync:
    # Pinned, not `ubuntu-latest`, which moves to Ubuntu 26 from 2026-10-19
    # (actions/runner-images#14748). Moving is a deliberate edit, tested with one
    # workflow_dispatch on a branch first: what can break is `npm ci` rebuilding
    # sharp's native binary, and Node 24 from setup-node on the new image.
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ (!(github.actor == 'ada-dispatcher[bot]' || github.actor_id == '357529844' || github.triggering_actor == 'ada-dispatcher[bot]') || (github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && github.ref == 'refs/heads/main' && inputs.dry == false && inputs.null_dead_links == false)) && (!cancelled() && needs.gate.outputs.run != 'false') }}
    environment: production
    # Setting this block zeroes every scope it does not list, so contents: read is
    # what keeps checkout working. issues: write is for the three issue steps
    # (unmapped category, rows needing a decision, red sync); actions: read lets
    # the red-sync step read this run's own step results.
    permissions:
      contents: read
      issues: write
      actions: read
    timeout-minutes: 20
    env:
      GISEKIBRIS_FEED_URL: ${{ secrets.GISEKIBRIS_FEED_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # A schedule has no inputs, so it always resolves to a real sync.
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry == true && 'true' || 'false' }}
    steps:
      # ─── Actions are pinned to COMMIT SHAs, not to a moving tag ─────────
      # A major tag is MUTABLE: whoever controls it can change what runs here
      # without a commit in this repo. That matters more than usual because this
      # repo is PUBLIC and this job holds SUPABASE_SERVICE_ROLE_KEY, which
      # bypasses RLS entirely — a compromised action would be reading it.
      # (The other half of that surface is already closed: this workflow has no
      # `pull_request` trigger, so a fork can never obtain these secrets.)
      # The trailing comment is the version, because a bare SHA tells the next
      # reader nothing about what they are on or whether it is current.
      #
      # ⚠ PINNED AT v7, HAVING FIRST PINNED v4 ON 2026-09-25 AND MOVED THE SAME
      #   DAY. The original argument was "do not smuggle a major bump into a
      #   hardening pass", which was right about bumps and wrong about this one:
      #   v4 actions declare `runs.using: node20`, and the runner now executes
      #   them on Node 24 anyway. A pin whose declared runtime is not the runtime
      #   it runs on documents something that is not happening — the pin was
      #   lying, which is worse than moving it. checkout v5 is the release that
      #   moved to node24; v7 also blocks fork-PR checkout under
      #   pull_request_target / workflow_run, which we do not use but which is one
      #   less footgun for whoever edits this next.
      #   Both setup-node breaking changes are inert here, checked rather than
      #   assumed: v5 auto-caches only when package.json has a `packageManager`
      #   field (ours has none) and v6 limits that to npm (we pass `cache: npm`
      #   explicitly anyway).
      # Resolved 2026-09-25 from refs/tags/v7 on each repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      # ⚠ NODE 24, AND 20 IS NOT AN OPTION. Run #1 died here:
      #     Error: Node.js 20 detected without native WebSocket support.
      #       at SupabaseClient._initRealtimeClient
      #   createClient() constructs a RealtimeClient eagerly, and realtime-js needs
      #   a native WebSocket, which Node 20 does not have. This pipeline never uses
      #   realtime — but the client is built before anyone asks.
      #
      #   The fix is the RUNTIME, not a dependency: adding `ws` would pull a package
      #   in to satisfy a feature we do not use. 24 rather than 22 because this
      #   laptop is on v24.15.0, and the whole failure class here was CI differing
      #   from local in a way that could not reproduce locally. Checked, not assumed:
      #   no pipeline script uses a version-sensitive API, and sharp declares
      #   engines >=20.9.0, so nothing needs a lower runtime.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is authoritative and this repo
      # is pinned to Expo SDK 54. CI must never resolve a different tree.
      - name: Install
        run: npm ci

      # The guards run before anything touches the network or the database, so a
      # broken guard is caught here rather than discovered by its silence.
      # FIRST, before the guards and before any network call. Run #1 spent four
      # minutes on real work and then failed at the first step needing Supabase
      # credentials. The cause was a Node version rather than a secret, but a
      # missing secret would have looked identical and been found in the same
      # expensive place — so the credentials are asserted here, by name, and the
      # step prints shapes only (length + scheme prefix), never values.
      - name: Pre-flight — are the four secrets present?
        run: node scripts/check-feed-secrets.mjs

      - name: Self-test the guards
        run: |
          node scripts/check-feed-secrets.mjs --selftest
          node scripts/fetch-gisekibris-feed.mjs --selftest
          node scripts/prepare-gisekibris-feed.mjs --selftest
          node scripts/import-gisekibris-events.mjs --selftest
          node scripts/check-gisekibris-urls.mjs --selftest
          node scripts/sweep-gisekibris-cancellations.mjs --selftest
          node scripts/check-prod-write-guard.mjs --selftest
          node scripts/check-prod-write-guard.mjs

      - name: Fetch the live feed
        run: node scripts/fetch-gisekibris-feed.mjs

      - name: Transform to the clean seed
        id: prepare
        run: node scripts/prepare-gisekibris-feed.mjs supabase/seed/gisekibris-feed-raw.json

      # An unmapped category no longer halts the sync: prepare imports it as 'other'
      # and records it in meta.unmapped_categories. This step turns each one into an
      # email — a new issue per value, or a comment on the open one with that exact
      # title, so a label that stays unmapped for a week is one thread, not seven.
      # continue-on-error: a reporting failure must not block the import. prepare's
      # ::warning:: annotation is the fallback signal if this step goes orange.
      # The raw value is partner-controlled text: it only ever travels as a quoted
      # argument or a jq --arg, never interpolated into shell source.
      - name: Report unmapped categories
        if: env.DRY != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seed=supabase/seed/gisekibris-events-clean.json
          n=$(jq '.meta.unmapped_categories | length' "$seed")
          if [ "$n" = "0" ]; then echo "No unmapped categories."; exit 0; fi
          open_issues=$(gh issue list --state open --limit 200 --json number,title)
          jq -c '.meta.unmapped_categories[]' "$seed" | while IFS= read -r u; do
            raw=$(jq -r '.raw // "(empty)"' <<<"$u")
            count=$(jq -r '.count' <<<"$u")
            title="Gişe Kıbrıs: unmapped category $raw"
            body=$(printf '%s\n\n%s\n\n%s\n' \
              "Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID imported $count event(s) with raw category \`$raw\` as **other**." \
              "Fix: add the value to \`CATEGORY\` in scripts/prepare-gisekibris-feed.mjs (events_category_check: music, nightlife, sports, arts, family, other). The next sync moves those rows out of 'other'." \
              "Close this issue once the mapping is on main.")
            num=$(jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty' <<<"$open_issues")
            if [ -n "$num" ]; then
              gh issue comment "$num" --body "$body"
              echo "Commented on #$num: $title"
            else
              gh issue create --title "$title" --body "$body"
              echo "Opened: $title"
            fi
          done

      # --apply nulls any ticket_url that no longer resolves, and takes a row the
      # partner marks cancelled OUT of the seed (meta.feed_cancelled) instead of
      # halting the job (Berke, 2026-11-14). It is listed in the issue below.
      - name: Probe ticket URLs and cancellation flags
        run: node scripts/check-gisekibris-urls.mjs --apply

      - name: Import
        run: |
          echo "event=$GITHUB_EVENT_NAME dry=$DRY"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$DRY" != "false" ]; then
            echo "::error::a scheduled run resolved to a dry run; the DRY input is broken"; exit 1
          fi
          if [ "$DRY" = "true" ]; then node scripts/import-gisekibris-events.mjs --dry
          else node scripts/import-gisekibris-events.mjs; fi

      # Runs LAST: it decides on absence from the feed just imported.
      # Leaves rows prepare skipped and rows cancelled in the feed alone (held for
      # Berke), and writes which of them are live in the app for the next step.
      # It also link-checks every upcoming approved row outside the feed (#601: the URL
      # probe above only sees feed rows) and reports dead ones (dead_links). A scheduled run
      # only reports; ticket_url is nulled only on a dispatch with null_dead_links.
      # A dry run sweeps with --dry: reads only, prints what it would cancel or null.
      - name: Sweep cancellations
        env:
          NULL_DEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.null_dead_links == true && 'true' || 'false' }}
        run: |
          flags=()
          [ "$DRY" = "true" ] && flags+=(--dry)
          [ "$NULL_DEAD" = "true" ] && flags+=(--null-dead-links)
          node scripts/sweep-gisekibris-cancellations.mjs "${flags[@]}" --report "$RUNNER_TEMP/gk-held.json"

      # The content question the exit codes above cannot answer.
      # Skipped on a dry run: it signs in (and deletes) one guest, and would read a DB this run did not update.
      - name: Content health
        if: env.DRY != 'true'
        run: node scripts/check-gisekibris-staleness.mjs

      # One issue, "Gişe Kıbrıs: rows need a decision", for every row this run left
      # out: skipped by prepare (no id, unknown city, …) or cancelled on the partner's
      # site. The body is rewritten each run; Berke is mentioned only when the set of
      # rows changes; it closes itself when the set is empty. Nothing here cancels
      # anything. Partner text travels only through jq, never into shell source.
      # Only after THIS run's prepare succeeded: otherwise the seed on disk is the committed
      # one, which carries no skipped rows, and the step would close the issue on a red sync.
      - name: Report rows that need a decision
        if: always() && steps.prepare.outcome == 'success' && env.DRY != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seed=supabase/seed/gisekibris-events-clean.json
          rep="$RUNNER_TEMP/gk-held.json"
          if [ ! -s "$rep" ]; then
            jq '{skipped: (.meta.skipped // []), feed_cancelled: (.meta.feed_cancelled // [])}' "$seed" > "$rep"
          fi
          # gsub defuses @mentions in partner titles (a zero-width space after the @).
          # WRONG LINK rows stay imported with ticket_url nulled; read from the seed, since
          # check-gisekibris-urls.mjs --apply writes meta.slug_mismatch there.
          list=$(jq -r --slurpfile s "$seed" '
            def live: if .in_app == true then " — **LIVE IN APP**" elif .in_app == false then "" else " — (live status not read)" end;
            ([.feed_cancelled[] | "- CANCELLED on Gişe Kıbrıs: \(.title) (`\(.external_id)`, \(.start_date[0:10]))" + live]
             + [.skipped[] | "- SKIPPED: \(.title)" + (if .external_id then " (`\(.external_id)`)" else "" end) + " — \(.reason)" + live]
             + [($s[0].meta.slug_mismatch // [])[] | "- WRONG LINK (Buy Ticket hidden): \(.title) (`\(.external_id)`, \(.start_date[0:10])) — \(.why); opened \(.landed)"]
             + [(.dead_links // [])[] | "- DEAD LINK (" + (if .nulled then "Buy Ticket hidden" else "Buy Ticket still showing" end) + "), not in the feed: \(.title) (`\(.external_id)`, \(.start_date[0:10])) — \(.why); \(.ticket_url)"])
            | join("\n") | gsub("@"; "@\u200b")' "$rep")
          title='Gişe Kıbrıs: rows need a decision'
          num=$(gh issue list --state open --limit 200 --json number,title,author | jq -r --arg t "$title" '[.[] | select(.title == $t and .author.login == "app/github-actions")][0].number // empty')
          if [ -z "$list" ]; then
            [ -z "$num" ] || gh issue close "$num" --comment 'No skipped, cancelled, wrong-link or dead-link rows in the latest sync.'
            echo "Nothing held."; exit 0
          fi
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "The latest sync left these rows out or hid their link. Nothing was cancelled automatically: a row marked LIVE IN APP is still showing and needs a decision. A WRONG LINK row is imported without its Buy Ticket button because its link opened another event. A DEAD LINK row is approved, upcoming and no longer in the feed, and its ticket page is gone (404 or their not-found page): cancel it, or dispatch with null_dead_links to hide the button." \
            "$list" \
            "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          printf '%s\n' "$list" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body "$body"$'\n\n@berkeustun95'
          else
            old=$(gh issue view "$num" --json body --jq .body | sed -n '/^- /p')
            gh issue edit "$num" --body "$body"
            [ "$old" = "$list" ] || gh issue comment "$num" --body "@berkeustun95 the rows changed:"$'\n\n'"$list"
          fi

      # A red sync used to email at best (finding 1 of the 2026-11 audit: six red days,
      # no issue). One issue stays open while the sync is red; it closes on green.
      - name: Alert on a red sync
        if: always() && env.DRY != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failing=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name == "sync") | .steps[] | select(.conclusion == "failure") | "- " + .name] | sort | join("\n")')
          title='Gişe Kıbrıs sync is red'
          num=$(gh issue list --state open --limit 200 --json number,title,author | jq -r --arg t "$title" '[.[] | select(.title == $t and .author.login == "app/github-actions")][0].number // empty')
          if [ -z "$failing" ]; then
            [ -z "$num" ] || gh issue close "$num" --comment 'The sync is green again.'
            exit 0
          fi
          body=$(printf 'Failing steps:\n\n%s\n\nRun: %s/%s/actions/runs/%s' "$failing" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body "$body"$'\n\n@berkeustun95'
          else
            gh issue comment "$num" --body "$body"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Gişe Kıbrıs sync — \`${{ job.status }}\`"
            echo ""
            echo "Ran at $(date -u '+%Y-%m-%d %H:%M UTC'). Step logs above carry every"
            echo "decision and the evidence it was made on."
          } >> "$GITHUB_STEP_SUMMARY"

      # One heartbeat row per sync run (schedule and dispatch are both real syncs). Never the
      # weekly-heartbeat job below. Non-fatal: a failure to record is one warning (data jobs, slice 2).
      - name: Record the run (data_job_runs)
        if: always() && env.DRY != 'true'
        timeout-minutes: 2
        env:
          JOB_STATUS: ${{ job.status }}
          REAL_RUN: 'true'
        run: node scripts/record-data-job-run.mjs --status="$JOB_STATUS" --real-run="$REAL_RUN"

  # ─── The weekly "it ran and it was boring" line ───────────────────────────
  #
  # NOT optional, and not decoration. CLAUDE.md records why: the duty roster
  # passed every schema check for two months while empty, and a monitor that only
  # ever speaks on failure is indistinguishable from a monitor that has stopped.
  # GitHub emails on failure only — so silence from the job above means EITHER
  # "healthy" OR "unscheduled, renamed, or disabled", and nothing distinguishes
  # those from the outside.
  #
  # This job's only purpose is to produce a POSITIVE artifact on a predictable
  # day, carrying the live numbers, so "nothing arrived this week" is a signal
  # rather than an absence.
  #
  # ⚠ RESIDUAL GAP, STATED RATHER THAN PAPERED OVER: this heartbeat lives inside
  #   the same GitHub Actions that it reports on. If Actions itself stops running
  #   the workflow, the heartbeat stops too and no email is sent, because nothing
  #   failed. Closing that properly needs a dead-man's switch OUTSIDE this repo
  #   (a service that alerts when it has NOT heard from us). Until then the honest
  #   statement is: if a Monday goes by without this appearing, dispatch the
  #   workflow (`gh workflow run gisekibris-feed`) and read its Content health step.
  #   `npm run gisekibris:health` no longer runs locally: it needs the service key,
  #   and no Mac holds one since 2026-10-01.
  weekly-heartbeat:
    if: ${{ (!(github.actor == 'ada-dispatcher[bot]' || github.actor_id == '357529844' || github.triggering_actor == 'ada-dispatcher[bot]') || (github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && github.ref == 'refs/heads/main' && inputs.dry == false && inputs.null_dead_links == false)) && (github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04   # pinned with sync — see the note there
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Is it Monday?
        id: day
        run: echo "monday=$([ "$(date -u +%u)" = "1" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        if: steps.day.outputs.monday == 'yes'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.day.outputs.monday == 'yes'
        with:
          node-version: '24'
          cache: npm

      - name: Install
        if: steps.day.outputs.monday == 'yes'
        run: npm ci

      - name: It ran and it was boring
        if: steps.day.outputs.monday == 'yes'
        run: |
          {
            echo "## Gişe Kıbrıs — weekly heartbeat"
            echo ""
            echo "It ran and it was boring. Numbers as of $(date -u '+%Y-%m-%d %H:%M UTC'):"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/check-gisekibris-staleness.mjs --warn 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo ""
            echo "If you are reading this, the scheduler is alive. If a Monday passes with"
            echo "no heartbeat, run \`npm run gisekibris:health\` locally — silence from"
            echo "Actions is not evidence of health."
          } >> "$GITHUB_STEP_SUMMARY"
