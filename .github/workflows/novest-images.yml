# ─── Novest images: mirror + re-encode (sharp) ───────────────────────────────
#
# The half sync-novest cannot do (sharp is native Node, the edge function is Deno).
# CI-only (scripts/lib/prod-write-guard.mjs). A manual run defaults to --dry.
#
# SCHEDULED, AND THE SCHEDULED RUN APPLIES (approved by Berke 2026-10-11). sync-novest
# (pg_cron 05:00 / 15:00 UTC) imports new listings, but a listing with no property_images
# row is hidden from users (props_hide_photoless_novest, 20261068). While this was
# manual-only, 8 listings published 6–8 Oct sat hidden until 11 Oct. Safe unattended:
# the SCHEDULED run inserts only (it never prunes, see PRUNE below), resumable, a no-op when nothing is due. Any failed image
# exits non-zero, so GitHub emails.
#
#   gh workflow run novest-images                              # dry
#   gh workflow run novest-images -f apply=true                # mirror everything due
#   gh workflow run novest-images -f apply=true -f limit=20    # first 20
#
# PRUNE (removes images Novest dropped from a listing's gallery). OFF by default and NEVER on the
# schedule: --prune is passed only when inputs.prune == 'true' AND the event is workflow_dispatch
# (the offline self-test step runs on dispatches only, so a lock refresh dropping the transitive js-yaml
# can never stop the scheduled add-only mirror; scripts/check-novest-prune.mjs runs the real Mirror step in bash with node stubbed, over all
# event x prune x apply combinations, and asserts that; mirror-novest-images.mjs refuses --prune in CI
# unless it is a workflow_dispatch with prune=true). Turning it on for cron, and the first applying
# prune, are Berke's call. Without apply=true a prune run only PRINTS the plan.
#
#   gh workflow run novest-images -f prune=true                # dry prune: prints what it would remove
#   gh workflow run novest-images -f apply=true -f prune=true  # applying prune (Berke's go first)

name: novest-images

on:
  schedule:
    # 20 min after each sync-novest run (05:00 / 15:00 UTC). GitHub may start it late.
    - cron: '20 5,15 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write to production (otherwise --dry)'
        type: boolean
        default: false
      limit:
        description: 'Optional: only the first N properties'
        type: string
        default: ''
      prune:
        description: 'Also remove images Novest dropped (prints the plan only unless apply is also true)'
        type: boolean
        default: false

concurrency: { group: prod-novest, cancel-in-progress: false }

jobs:
  # ─── The pause switch (data jobs, slice 3) ─────────────────────────────────
  # Asks public.data_job_gate whether novest-images is paused (admin screen "Data jobs"). A paused answer skips
  # the working job below: nothing writes, no heartbeat row (the gate records one skipped_paused row), no alert step runs.
  # FAIL-OPEN: any error here (key, network, RPC not applied yet, even a failing step) lets the working job run: every step here has
  # continue-on-error: true and the job has none (a job-level one is forbidden by scripts/check-dispatcher-actor.mjs);
  # only the exact output `false` stops it. See scripts/data-job-gate.mjs.
  gate:
    if: ${{ (!(github.actor == 'ada-dispatcher[bot]' || github.actor_id == '357529844' || github.triggering_actor == 'ada-dispatcher[bot]') || (github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && github.ref == 'refs/heads/main' && inputs.apply == false && inputs.limit == '' && inputs.prune == false)) }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
        continue-on-error: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
        continue-on-error: true
      - name: Pause switch (data_job_gate)
        id: gate
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.event_name == 'schedule' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: node scripts/data-job-gate.mjs
        continue-on-error: true

  run:
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ (!(github.actor == 'ada-dispatcher[bot]' || github.actor_id == '357529844' || github.triggering_actor == 'ada-dispatcher[bot]') || (github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && github.ref == 'refs/heads/main' && inputs.apply == false && inputs.limit == '' && inputs.prune == false)) && (!cancelled() && needs.gate.outputs.run != 'false') }}
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      IN_APPLY: ${{ inputs.apply }}
      IN_LIMIT: ${{ inputs.limit }}
      IN_PRUNE: ${{ inputs.prune }}
      # ONE write gate, read by the Mirror step and the record step: a scheduled run applies, a dispatch only with apply=true.
      WRITE: ${{ github.event_name == 'schedule' || inputs.apply == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Secrets and inputs
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
          [ -z "$IN_LIMIT" ] || [[ "$IN_LIMIT" =~ ^[1-9][0-9]*$ ]] || { echo "::error::limit must be a positive integer"; exit 1; }
      - name: Prune planner self-test (offline)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/check-novest-prune.mjs
      - name: Mirror
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$WRITE" != "true" ]; then
            echo "::error::a scheduled run resolved to a dry run; the WRITE gate is broken"; exit 1
          fi
          args=()
          [ "$IN_PRUNE" = "true" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && args+=(--prune)
          [ "$WRITE" = "true" ] || args+=(--dry)
          [ -z "$IN_LIMIT" ] || args+=(--limit "$IN_LIMIT")
          node scripts/mirror-novest-images.mjs "${args[@]}"

      # One heartbeat row per real run (applies, no --limit). Non-fatal: a failure to record is one warning (data jobs, slice 2).
      - name: Record the run (data_job_runs)
        if: ${{ always() && env.WRITE == 'true' && !inputs.limit }}
        timeout-minutes: 2
        env:
          JOB_STATUS: ${{ job.status }}
          REAL_RUN: ${{ env.WRITE == 'true' && !inputs.limit }}
        run: node scripts/record-data-job-run.mjs --status="$JOB_STATUS" --real-run="$REAL_RUN"
